# Pruebas en cada push y PR a main: núcleo de la app (sin navegador) y que la app compile con su CSP.
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Nazca (importador de CSV)
        run: node dev/tests/nazca.mjs

      - name: Pruebas de seguridad del servidor
        run: |
          node dev/tests/carrera.mjs
          node dev/tests/cors.mjs

      - name: La app compila (y su CSP se genera)
        run: sh dev/web/build.sh
