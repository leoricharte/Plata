# Compila la app de Android (la web de Plata empaquetada con Capacitor) y deja dos archivos para descargar:
#   · plata-release.aab  → el que se sube a Google Play (firmado si están los 4 secretos de abajo; si no, sale SIN firmar y solo sirve para comprobar que compila)
#   · plata-debug.apk    → para instalar directo en tu teléfono y probar (firmado con la llave de depuración)
# Se lanza a mano: Actions → Android → Run workflow. En la rama android-capacitor también corre solo en cada push, para ir comprobando la compilación.
# Secretos (Settings → Secrets and variables → Actions), explicados en android/LEEME.md:
#   ANDROID_KEYSTORE_BASE64   el archivo .jks de la llave de subida, en base64
#   ANDROID_KEYSTORE_PASSWORD la contraseña del archivo
#   ANDROID_KEY_ALIAS         el alias de la llave
#   ANDROID_KEY_PASSWORD      la contraseña de la llave
#   claude de mierda
name: Android

on:
  workflow_dispatch:
  push:
    branches: [ "android-capacitor" ]
    paths: [ "android/**", "dev/app/src/**", ".github/workflows/android.yml" ]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pruebas de la web que tocan Android (avisos y frase)
        run: |
          node dev/tests/avisos.mjs
          node dev/tests/frase.mjs

      - name: Compilar la web (la misma de web.plataapp.net)
        run: sh dev/web/build.sh

      - name: Versión (sale de APP_BUILD; el versionCode siempre sube con el número de ejecución)
        run: |
          build=$(grep -ho 'const APP_BUILD = [0-9]*' dev/app/src/js/*.js | grep -o '[0-9]*$')
          [ -n "$build" ] || { echo "No encontré APP_BUILD en dev/app/src/js/"; exit 1; }
          echo "PLATA_VERSION_NAME=5.0.$build" >> "$GITHUB_ENV"
          echo "PLATA_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"
          echo "Plata para Android 5.0.$build (versionCode $((1000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT)))"

      - name: Instalar Capacitor y crear el proyecto de Android
        working-directory: android
        run: |
          npm install --no-audit --no-fund
          rm -rf www && cp -r ../dist-web www
          npx cap add android
          node scripts/prepare.mjs
          npx cap sync android

      - name: Llave de firma (solo si están los secretos)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/plata-subida.jks"
            {
              echo "PLATA_KEYSTORE_FILE=$RUNNER_TEMP/plata-subida.jks"
              echo "PLATA_KEYSTORE_PASSWORD=$KS_PASS"
              echo "PLATA_KEY_ALIAS=$KEY_ALIAS"
              echo "PLATA_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
            echo "El AAB saldrá firmado con tu llave de subida."
          else
            echo "::notice::Sin secretos de firma: el AAB sale SIN firmar (sirve para comprobar que compila, no para subirlo a Play). Ver android/LEEME.md."
          fi

      - name: Compilar el AAB y el APK de prueba
        working-directory: android/android
        run: ./gradlew --no-daemon bundleRelease assembleDebug

      - name: Reunir los archivos
        run: |
          mkdir -p salida
          cp android/android/app/build/outputs/bundle/release/*.aab salida/plata-release.aab
          cp android/android/app/build/outputs/apk/debug/*.apk salida/plata-debug.apk
          ls -la salida

      - name: Revisar por dentro el APK y el AAB (la web, el plugin, los permisos, los enlaces)
        run: python3 android/scripts/check-apk.py salida/plata-debug.apk salida/plata-release.aab

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plata-android-${{ github.run_number }}
          path: salida/*
          if-no-files-found: error
