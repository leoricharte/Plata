name: Plata para escritorio (Windows)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta del release. Si la dejas vacía usa desktop-b<compilación> (ej. desktop-b452)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Versión (sale de APP_BUILD, así no se desfasa)
        id: ver
        shell: bash
        env:
          TAG_IN: ${{ inputs.tag }}
        run: |
          build=$(grep -o 'const APP_BUILD = [0-9]*' dev/app/src/app.html | grep -o '[0-9]*$')
          [ -n "$build" ] || { echo "No encontré APP_BUILD en dev/app/src/app.html"; exit 1; }
          ver="3.0.$build"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_IN:-desktop-b$build}" >> "$GITHUB_OUTPUT"
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$ver\"/" dev/desktop/package.json dev/desktop/src-tauri/tauri.conf.json
          sed -i "0,/^version = \"[0-9.]*\"/s//version = \"$ver\"/" dev/desktop/src-tauri/Cargo.toml
          echo "Compilando Plata para Windows $ver"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: dev/desktop/src-tauri

      - name: Preparar la app (misma que la web)
        shell: bash
        run: |
          python3 dev/app/build.py
          mkdir -p dev/desktop/dist
          cp dev/app/out/finanzas.html dev/desktop/dist/index.html

      - name: Instalar dependencias
        working-directory: dev/desktop
        run: npm install

      - name: Generar íconos
        working-directory: dev/desktop
        run: npx tauri icon ../../press/plata-icono-1024.png

      - name: Compilar instaladores
        working-directory: dev/desktop
        run: npx tauri build

      - name: Publicar release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Plata para Windows (compilación ${{ steps.ver.outputs.build }})
          prerelease: true
          body: |
            Plata para Windows. Instalador sin firma: Windows puede mostrar «Windows protegió tu PC». Pulsa «Más información» → «Ejecutar de todos modos».
          fail_on_unmatched_files: true
          files: |
            dev/desktop/src-tauri/target/release/bundle/nsis/*.exe
            dev/desktop/src-tauri/target/release/bundle/msi/*.msi
