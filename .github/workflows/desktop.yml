name: Plata para escritorio (Windows)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta del release (ej. desktop-beta3-420)"
        required: true
        default: "desktop-beta3-420"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: dev/desktop/src-tauri

      - name: Preparar la app (misma que la web)
        shell: bash
        run: |
          python3 dev/app/build.py
          mkdir -p dev/desktop/dist
          cp dev/app/out/finanzas.html dev/desktop/dist/index.html

      - name: Instalar dependencias
        working-directory: dev/desktop
        run: npm install

      - name: Generar íconos
        working-directory: dev/desktop
        run: npx tauri icon ../../press/plata-icono-1024.png

      - name: Compilar instaladores
        working-directory: dev/desktop
        run: npx tauri build

      - name: Publicar release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Plata para Windows (Beta 3 · compilación 420)
          prerelease: true
          body: |
            Plata para Windows. Instalador sin firma: Windows puede mostrar «Windows protegió tu PC». Pulsa «Más información» → «Ejecutar de todos modos».
          files: |
            dev/desktop/src-tauri/target/release/bundle/nsis/*.exe
            dev/desktop/src-tauri/target/release/bundle/msi/*.msi
