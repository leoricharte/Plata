.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:calc(var(--sat) + 8px) 16px calc(var(--sab) + 116px);display:none;scrollbar-width:none}

.screen.leaving{display:block;pointer-events:none}

.screen.leaving.l-pop{animation:popout .42s cubic-bezier(.32,.72,0,1) forwards;z-index:3;background:var(--bg)}

  const Y = (v) => top + ((hi - Math.max(lo, Math.min(hi, v))) / (hi - lo)) * h;
  const X = (i) => x0 + i * ((x1 - x0) / (series.length - 1));
  let g = '';
  if (lo < 0) g += '<rect x="0" y="' + Y(0) + '" width="' + x1 + '" height="' + (Y(lo) - Y(0)) + '" fill="#FF3B30" fill-opacity=".1"/>';
  for (let v = lo, guard = 0; v <= hi && guard < 40; v += step, guard++) {
    g += '<line x1="0" y1="' + Y(v) + '" x2="' + x1 + '" y2="' + Y(v) + '" stroke="' + (v === 0 ? '#8E8E93' : '#E5E5EA') + '"' + (v === 0 ? ' stroke-dasharray="4 4"' : '') + '/>' +
      '<text x="' + W + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="13" fill="#6C6C70">' + axis(v) + '</text>';
  }
  if (lo < 0) g += '<text x="' + (x1 - 6) + '" y="' + (Y(lo) - 6) + '" text-anchor="end" font-size="12" fill="var(--rt)">zona en rojo</text>';
  const pts = series.map((s, i) => X(i).toFixed(1) + ',' + Y(s.v).toFixed(1)).join(' ');
  const cur = { v: valAt(series, sel) };
  g += '<line x1="' + X(sel) + '" y1="' + top + '" x2="' + X(sel) + '" y2="' + bot + '" stroke="#8E8E93" stroke-dasharray="3 3"/>' +
    '<polyline points="' + pts + '" fill="none" stroke="#1A9D63" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + X(sel) + '" cy="' + Y(cur.v) + '" r="7" fill="var(--card)" stroke="' + (cur.v < 0 ? '#FF3B30' : '#1A9D63') + '" stroke-width="3.5"/>';
  return '<svg viewBox="0 0 ' + W + ' 200" style="width:100%;height:auto;font-family:inherit" role="img" aria-label="Proyección semanal del balance">' + g + '</svg>';
}

  if (ui.form && ui.form.kind === 'sim') { syncForm(); const i = data.planned.findIndex((x) => x.id === id); if (i >= 0) data.planned[i] = ui.form.obj; }
  const pl = data.planned.find((x) => x.id === id); if (!pl) return;
  const pcard = pl.kind === 'pay' ? data.cards.find((x) => x.id === pl.card) : null;
  if (pcard) {
    const amtC = round2(fromUSD(Math.abs(pl.amount), pcard.cur)); if (!(amtC > 0)) { toast('Escribe un monto'); return; }
    registerPay(pcard, amtC, iso(getToday()), pl.acc, 'Pago de ' + pcard.name);
    data.planned = data.planned.filter((x) => x.id !== id);
    ui.dirty++; persist(); closeSheet(); ui.form = null; renderAll(); toast('Pago registrado'); return;
  }
  const acc = accOf(pl.acc), amt = round2(fromUSD(Math.abs(pl.amount), acc.cur));

  data.transactions.push({ id: nextTxId(), date: iso(getToday()), amount: -amt, category: CAT_ORDER.indexOf(pl.cat) >= 0 ? pl.cat : 'Otros', note: pl.name.replace(/\s*\(simulado\)/i, ''), acc: acc.id });
  applyTo(acc, -amt);

}
