.device{position:absolute;inset:0;overflow:hidden;overflow:clip;background:var(--bg)}

html.preview{--sat:59px;--sab:34px}
html.preview .only-frame{display:flex}
.island{position:absolute;top:11px;left:50%;margin-left:-63px;width:126px;height:37px;border-radius:20px;background:#000;z-index:60;pointer-events:none}
.statusbar{position:absolute;top:0;left:0;right:0;height:59px;z-index:55;padding:19px 34px 0 46px;justify-content:space-between;align-items:flex-start;font-size:17px;font-weight:600;pointer-events:none}
.homebar{position:absolute;bottom:8px;left:50%;margin-left:-70px;width:140px;height:5px;border-radius:3px;background:#1C1C1E;z-index:60;pointer-events:none}

.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:calc(var(--sat) + 8px) 16px calc(var(--sab) + 124px);display:none;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.active{display:block}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 4px 10px}
.eyebrow{font-size:15px;color:var(--mute)}
h1{margin:2px 0 0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-0.035em}
.actions{display:flex;gap:8px}
.glassbtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 16px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}
.filestat{font-size:15px;color:var(--mute);padding:0 4px 14px}
.filestat b{color:#B54708;font-weight:600}

/* Tarjetas */
.card{background:#fff;border-radius:26px;padding:18px;margin-bottom:14px}
.lbl{font-size:15px;color:var(--mute)}
.big{font-size:30px;font-weight:700;letter-spacing:-0.035em;line-height:1.1}
.sub{font-size:15px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .big{font-size:26px}
.link{color:var(--accent);font-size:15px;font-weight:500;text-align:left;margin-top:auto;padding-top:6px}
.minibars{display:flex;gap:5px;height:54px;margin-top:8px}
.minibars div{flex:1;border-radius:5px;background:#F3F3F5;display:flex;flex-direction:column;justify-content:flex-end}
.minibars i{display:block;border-radius:5px;background:#EDB03E}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mute);margin:6px 0 10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend u{width:10px;height:10px;border-radius:3px;display:block}
.ringrow{display:flex;align-items:center;gap:14px}
.catlist{flex:1;min-width:0}
.catlist div{display:flex;align-items:center;gap:8px;min-height:36px;border-top:1px solid var(--line);font-size:15px}
.catlist div:first-child{border-top:0}
.catlist i{width:10px;height:10px;border-radius:50%;display:block;flex:none}
.catlist span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catlist b{font-weight:600}

/* Listas */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.tile{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700;flex:none}
.grow{flex:1;min-width:0}
.name{font-size:17px;font-weight:600;letter-spacing:-0.02em}
.amt{font-size:16px;font-weight:500;white-space:nowrap}
.chev{flex:none}

.bar i{display:block;height:4px;border-radius:2px}
.linkrow{display:flex;align-items:center;gap:10px;min-height:44px;color:var(--accent);font-size:17px;text-align:left}
.empty{padding:18px 0;color:var(--mute);font-size:15px;text-align:center}

.seg{display:flex;padding:3px;border-radius:999px;background:#E5E5EA;margin-bottom:14px}
.seg button{flex:1;height:40px;border-radius:999px;font-size:15px;font-weight:500}
.seg button.on{background:#fff;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.14)}
.switch{width:51px;height:31px;border-radius:999px;background:rgba(120,120,128,.32);position:relative;flex:none;transition:background .2s}
.switch span{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:left .2s}
.switch.on{background:#34C759}
.switch.on span{left:22px}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:44px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#D1D1D6}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-12px;border-radius:50%;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 3px 8px rgba(0,0,0,.18),0 1px 1px rgba(0,0,0,.16)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#D1D1D6}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 3px 8px rgba(0,0,0,.18)}
.pill{display:inline-block;font-size:14px;font-weight:600;padding:6px 12px;border-radius:999px;margin-top:8px}
.ticks{display:flex;justify-content:space-between;padding:2px 46px 0 4px;font-size:12px;color:var(--mute)}
.stats{display:flex;gap:28px;padding-top:12px;border-top:1px solid var(--line);margin-top:4px}
.stats b{display:block;font-size:20px;font-weight:700;letter-spacing:-0.02em}
.tl{border-left:2px solid #E5E5EA;margin:14px 0 0 5px}
.tl .ev{position:relative;padding:0 0 18px 18px;display:flex;align-items:center;gap:10px}
.tl .ev:last-child{padding-bottom:0}
.tl .dot{position:absolute;left:-7px;top:50%;margin-top:-6px;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 3px #fff}
.foot{text-align:center;padding:8px 0 4px}
.foot button{color:var(--mute);font-size:15px;min-height:44px;padding:0 12px}

/* Barra de pestañas flotante (Liquid Glass, más tintada como en iOS 27) */
.tabbar{position:absolute;left:16px;right:16px;bottom:max(calc(var(--sab) - 8px),12px);height:68px;z-index:30;display:flex;align-items:center;gap:2px;padding:6px;border-radius:999px;background:rgba(250,250,252,.84);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 36px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%)}
.tab{flex:1;min-width:0;height:56px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#3A3A3C;font-size:11px;font-weight:500;transition:background .2s,color .2s}
.tab svg{width:24px;height:24px}
.tab{position:relative;z-index:1}
.tab.on{color:var(--accent);font-weight:600}
.pill{position:absolute;left:0;top:6px;height:56px;border-radius:999px;z-index:0;pointer-events:none;background:rgba(120,120,128,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 0 0 .5px rgba(255,255,255,.5);will-change:transform;transform-origin:50% 50%;transition:background .2s,box-shadow .2s;backdrop-filter:brightness(1.1) saturate(1.4);-webkit-backdrop-filter:brightness(1.1) saturate(1.4)}
.pill::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 90% at var(--lx,30%) -30%,rgba(255,255,255,.75),rgba(255,255,255,0) 55%);opacity:.5;transition:opacity .2s}
.pill.bubble{background:rgba(255,255,255,.22);backdrop-filter:blur(1px) brightness(1.18) saturate(1.7);-webkit-backdrop-filter:blur(1px) brightness(1.18) saturate(1.7);box-shadow:inset 0 1px 1px rgba(255,255,255,.95),inset 1.5px 0 0 rgba(255,90,140,.28),inset -1.5px 0 0 rgba(70,150,255,.32),0 8px 24px rgba(0,0,0,.2)}
.pill.bubble::after{opacity:1}
.tabbar{touch-action:none;user-select:none;-webkit-user-select:none}
.gear{position:absolute;top:calc(var(--sat) + 8px);right:16px;z-index:25}
.mini{width:96px;height:40px;border:0;outline:0;border-radius:12px;background:#F2F2F7;text-align:right;padding:0 12px;font-size:17px}

/* Hoja para añadir movimientos */
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:8px;right:8px;bottom:calc(var(--sab) - 18px + 8px);z-index:50;background:#fff;border-radius:34px;padding:10px 18px 18px;transform:translateY(120%);transition:transform .35s cubic-bezier(.3,.9,.3,1);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet.show{transform:translateY(0)}
.grab{width:36px;height:5px;border-radius:3px;background:#D1D1D6;margin:0 auto 12px}

.amount input{border:0;outline:0;background:transparent;font-size:40px;font-weight:700;letter-spacing:-0.04em;width:100%;padding:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}

.chip{flex:none;height:40px;padding:0 16px;border-radius:999px;background:#F2F2F7;font-size:15px;font-weight:500}
.chip.on{background:#1C1C1E;color:#fff}
.field{width:100%;height:48px;border-radius:14px;border:0;outline:0;background:#F2F2F7;padding:0 14px;font-size:17px;margin-bottom:10px}
.primary{width:100%;height:54px;border-radius:999px;background:linear-gradient(180deg,#2C2C2E,#0B0B0C);color:#fff;font-size:18px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.toast{position:absolute;left:50%;bottom:calc(var(--sab) + 100px);transform:translate(-50%,20px);opacity:0;z-index:70;background:rgba(28,28,30,.92);color:#fff;font-size:15px;font-weight:500;padding:12px 18px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pd = (s) => { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const fmt = (n) => (n < 0 ? '−' : '') + '$' + Math.abs(Math.round(n)).toLocaleString('en-US');
const fmt2 = (n) => '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtSigned2 = (n) => (n < 0 ? '−' : '+') + fmt2(n);
const axis = (v) => { const a = Math.abs(v), sg = v < 0 ? '−' : ''; return a >= 1000 ? sg + '$' + (a / 1000).toString().replace(/\.0$/, '') + 'k' : sg + '$' + a; };
const dshort = (d) => d.getDate() + ' ' + MON[d.getMonth()];
const dlabel = (d) => DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);

/* ---------- Estado ---------- */
function migrate(o) {
  if (!o || typeof o !== 'object') throw new Error('formato');
  const d = clone(SAMPLE);
  const out = {
    version: 2,
    settings: Object.assign({ currency: 'USD', cushion: 300, variable_weekly: 230 }, o.settings || {}),
    accounts: Array.isArray(o.accounts) && o.accounts.length ? o.accounts : [{ id: 'bank', name: 'Cuenta principal', balance: 0 }],
    transactions: Array.isArray(o.transactions) ? o.transactions : [],
    history: Array.isArray(o.history) ? o.history : [],
    cards: Array.isArray(o.cards) ? o.cards : [],
    recurring: Array.isArray(o.recurring) ? o.recurring : [],
    expected_income: Array.isArray(o.expected_income) ? o.expected_income : [],
    planned: Array.isArray(o.planned) ? o.planned : []
  };
  if (!Array.isArray(o.transactions) && !Array.isArray(o.cards) && !Array.isArray(o.accounts)) throw new Error('vacío');
  out.transactions.forEach((t, i) => { if (!t.id) t.id = 1000 + i; });
  void d;
  return out;
}
function loadStored() {
  try { const s = localStorage.getItem(KEY); return s ? migrate(JSON.parse(s)) : null; } catch (e) { return null; }
}
let data = loadStored() || clone(SAMPLE);
const ui = { tab: 'resumen', week: 8, variable: true, mov: 'all', interest: false, sheetType: 'out', sheetCat: 'Comida', dirty: 0 };
try { ui.dirty = Number(localStorage.getItem(KEY_DIRTY)) || 0; } catch (e) { /* sin almacenamiento */ }
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); localStorage.setItem(KEY_DIRTY, String(ui.dirty)); } catch (e) { /* sin almacenamiento */ }
}
function getToday() {
  if (data.settings && data.settings.demo_today) return pd(data.settings.demo_today);
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}

/* ---------- Cálculos ---------- */
function calc() {
  const today = getToday();
  const mk = iso(today).slice(0, 7);
  const tx = data.transactions.slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.id || 0) - (a.id || 0)));
  const monthTx = tx.filter((t) => t.date.slice(0, 7) === mk);
  const income = sum(monthTx.filter((t) => t.amount > 0), (t) => t.amount);
  const expense = -sum(monthTx.filter((t) => t.amount < 0), (t) => t.amount);
  const incomeCount = monthTx.filter((t) => t.amount > 0).length;
  const catTot = {};
  monthTx.filter((t) => t.amount < 0).forEach((t) => {
    const c = CAT_ORDER.indexOf(t.category) >= 0 ? t.category : 'Otros';
    catTot[c] = (catTot[c] || 0) - t.amount;
  });
  const cats = CAT_ORDER.filter((c) => catTot[c] > 0).map((c) => ({ name: c, v: catTot[c], color: CAT_COLOR[c] }));
  const monday = addDays(today, -((today.getDay() + 6) % 7));
  const week = [];
  for (let i = 0; i < 7; i++) {
    const k = iso(addDays(monday, i));
    week.push(-sum(tx.filter((t) => t.date === k && t.amount < 0), (t) => t.amount));
  }
  const months = data.history.slice().sort((a, b) => (a.month < b.month ? -1 : 1)).slice(-5)
    .map((h) => ({ label: MON[Number(h.month.slice(5, 7)) - 1], income: h.income, expense: h.expense, cur: false }));
  months.push({ label: MON[today.getMonth()], income: income, expense: expense, cur: true });
  const balance = sum(data.accounts, (a) => a.balance);
  const cards = data.cards.map((c, i) => Object.assign({}, c, { color: CARD_COLORS[i % CARD_COLORS.length], util: c.limit ? Math.round((c.balance / c.limit) * 100) : 0, interest: (c.balance * c.apr) / 100 / 12 }));
  const debt = sum(cards, (c) => c.balance);
  const interest = sum(cards, (c) => c.interest);
  return { today, mk, tx, monthTx, income, expense, incomeCount, cats, week, weekTotal: sum(week, (v) => v), months, balance, cards, debt, interest };
}

function genEvents(today) {
  const end = addDays(today, 84), ev = [];
  const monthly = (day, fn) => {
    for (let k = 0; k <= 3; k++) {
      const base = new Date(today.getFullYear(), today.getMonth() + k, 1);
      const last = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
      const d = new Date(base.getFullYear(), base.getMonth(), Math.min(day, last));
      if (d > today && d <= end) fn(d);
    }
  };
  data.recurring.forEach((r) => monthly(r.day || 1, (d) => ev.push({ date: d, name: r.name, amt: r.amount, type: 'rec' })));
  data.cards.forEach((c) => { if (c.payment > 0) monthly(c.due_day || 1, (d) => ev.push({ date: d, name: 'Pago ' + c.name, amt: -c.payment, type: 'card' })); });
  data.expected_income.forEach((e) => {
    let d = pd(e.next); const step = Math.max(1, e.every_days || 14);
    while (d <= today) d = addDays(d, step);
    while (d <= end) { ev.push({ date: d, name: e.name, amt: e.amount, type: 'in' }); d = addDays(d, step); }
  });
  data.planned.forEach((p) => { const d = pd(p.date); if (d > today && d <= end) ev.push({ date: d, name: p.name, amt: p.amount, type: 'rec' }); });
  return ev.sort((a, b) => a.date - b.date);
}

function projection() {
  const c = calc();
  const V = ui.variable ? (data.settings.variable_weekly || 0) : 0;
  const events = genEvents(c.today);
  const series = [];
  for (let i = 0; i <= 12; i++) {
    const end = addDays(c.today, 7 * i);
    let s = 0;
    events.forEach((e) => { if (e.date <= end) s += e.amt; });
    series.push({ date: end, v: c.balance + s - V * i });
  }
  let cum = 0;
  const timeline = events.slice(0, 8).map((e) => {
    cum += e.amt;
    const days = Math.round((e.date - c.today) / 86400000);
    return { name: e.name, date: dlabel(e.date), amt: e.amt, type: e.type, after: c.balance + cum - (V * days) / 7 };
  });
  const minV = Math.min.apply(null, series.map((s) => s.v));
  const firstRed = series.find((s) => s.v < 0);
  return { c, series, timeline, minV, firstRed, V };
}

/* ---------- Gráficos (SVG) ---------- */
function ringArcs(items, R, sw, gap) {
  const total = items.reduce((s, i) => s + i.v, 0) || 1, C = 2 * Math.PI * R;
  let cum = 0;
  return items.map((it) => {
    const share = it.v / total;
    const dash = Math.max(1, C * share - gap - sw);
    const off = -(cum * C + (gap + sw) / 2);
    cum += share;
    return { color: it.color, dash: dash.toFixed(1), off: off.toFixed(1) };
  });
}
function ringSVG(items, R, sw, gap, size, center, extra) {
  const cx = size / 2;
  const arcs = ringArcs(items, R, sw, gap).map((a) => '<circle cx="' + cx + '" cy="' + cx + '" r="' + R + '" fill="none" stroke="' + a.color + '" stroke-width="' + sw + '" stroke-linecap="round" stroke-dasharray="' + a.dash + ' 2000" stroke-dashoffset="' + a.off + '" transform="rotate(-90 ' + cx + ' ' + cx + ')"/>').join('');
  return '<svg viewBox="0 0 ' + size + ' ' + size + '" style="width:100%;height:auto;font-family:inherit" role="img" aria-label="Gráfico de anillo">' + (extra || '') + '<circle cx="' + cx + '" cy="' + cx + '" r="' + R + '" fill="none" stroke="#F3F3F5" stroke-width="' + sw + '"/>' + arcs + center + '</svg>';
}
function barsSVG(months) {
  const W = 334, H = 204, plotTop = 10, plotBot = 172, plotH = plotBot - plotTop, plotW = 282;
  const maxV = Math.max.apply(null, months.map((m) => Math.max(m.income, m.expense)).concat([1]));
  const yMax = Math.max(500, Math.ceil(maxV / 500) * 500);
  const yy = (v) => plotBot - (v / yMax) * plotH;
  let g = '';
  [0, yMax / 2, yMax].forEach((v) => {
    g += '<line x1="0" y1="' + yy(v) + '" x2="' + plotW + '" y2="' + yy(v) + '" stroke="' + (v === 0 ? '#D1D1D6' : '#E5E5EA') + '"/>' +
      '<text x="' + W + '" y="' + (yy(v) + 4) + '" text-anchor="end" font-size="13" fill="#6C6C70">' + axis(v) + '</text>';
  });
  const gw = plotW / months.length;
  months.forEach((m, i) => {
    const x0 = i * gw + (gw - 29) / 2;
    const he = Math.max(m.expense > 0 ? 3 : 0, (m.expense / yMax) * plotH), hi = Math.max(m.income > 0 ? 3 : 0, (m.income / yMax) * plotH);
    g += '<rect x="' + x0 + '" y="' + (plotBot - he) + '" width="13" height="' + he + '" rx="4" fill="#EDB03E"/>' +
      '<rect x="' + (x0 + 16) + '" y="' + (plotBot - hi) + '" width="13" height="' + hi + '" rx="4" fill="#6D8BEA"/>' +
      '<text x="' + (i * gw + gw / 2) + '" y="196" text-anchor="middle" font-size="13" fill="' + (m.cur ? '#1C1C1E' : '#6C6C70') + '" font-weight="' + (m.cur ? 600 : 400) + '">' + m.label + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;font-family:inherit" role="img" aria-label="Ingresos y gastos por mes">' + g + '</svg>';
}
function projSVG(series, sel) {
  const W = 334, x0 = 4, x1 = 288, top = 10, bot = 190, h = bot - top;
  const vals = series.map((s) => s.v);
  const maxV = Math.max.apply(null, vals), minV = Math.min.apply(null, vals);
  const hi = Math.max(1000, Math.ceil((maxV + 1) / 500) * 500);
  const lo = minV < 0 ? Math.floor(minV / 500) * 500 : 0;
  const step = hi - lo <= 2500 ? 500 : 1000;
  const Y = (v) => top + ((hi - Math.max(lo, Math.min(hi, v))) / (hi - lo)) * h;
  const X = (i) => x0 + i * ((x1 - x0) / 12);
  let g = '';
  if (lo < 0) g += '<rect x="0" y="' + Y(0) + '" width="' + x1 + '" height="' + (Y(lo) - Y(0)) + '" fill="#FF3B30" fill-opacity=".1"/>';
  for (let v = lo; v <= hi; v += step) {
    g += '<line x1="0" y1="' + Y(v) + '" x2="' + x1 + '" y2="' + Y(v) + '" stroke="' + (v === 0 ? '#8E8E93' : '#E5E5EA') + '"' + (v === 0 ? ' stroke-dasharray="4 4"' : '') + '/>' +
      '<text x="' + W + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="13" fill="#6C6C70">' + axis(v) + '</text>';
  }
  if (lo < 0) g += '<text x="' + (x1 - 6) + '" y="' + (Y(lo) - 6) + '" text-anchor="end" font-size="12" fill="#D70015">zona en rojo</text>';
  const pts = series.map((s, i) => X(i).toFixed(1) + ',' + Y(s.v).toFixed(1)).join(' ');
  const cur = series[sel];
  g += '<line x1="' + X(sel) + '" y1="' + top + '" x2="' + X(sel) + '" y2="' + bot + '" stroke="#8E8E93" stroke-dasharray="3 3"/>' +
    '<polyline points="' + pts + '" fill="none" stroke="#0A6CFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + X(sel) + '" cy="' + Y(cur.v) + '" r="7" fill="#fff" stroke="' + (cur.v < 0 ? '#FF3B30' : '#0A6CFF') + '" stroke-width="3.5"/>';
  return '<svg viewBox="0 0 ' + W + ' 200" style="width:100%;height:auto;font-family:inherit" role="img" aria-label="Proyección semanal del balance">' + g + '</svg>';
}

function renderMovimientos() {
  const c = calc();

  const rows = list.map((t) => {
    const cat = t.amount > 0 ? 'Ingreso' : (CAT_ORDER.indexOf(t.category) >= 0 ? t.category : 'Otros');
    const d = pd(t.date);
    return '<div class="row"><span class="tile" style="background:' + CAT_COLOR[cat] + '" aria-hidden="true">' + cat.charAt(0) + '</span>' +
      '<div class="grow"><div class="name" style="font-size:16px">' + esc(t.note || cat) + '</div><div class="sub" style="font-size:13px">' + cat + ' · ' + dshort(d) + '</div></div>' +
      '<span class="amt" style="color:' + (t.amount > 0 ? '#248A3D' : '#1C1C1E') + '">' + fmtSigned2(t.amount) + '</span>' + ICON.chev + '</div>';
  }).join('');
  const seg = (k, label) => '<button class="' + (ui.mov === k ? 'on' : '') + '" data-act="mov:' + k + '">' + label + '</button>';
  $('#s-movimientos').innerHTML =
    '<div class="head"><div><div class="eyebrow">Últimos movimientos</div><h1>Movimientos</h1></div></div>' +
    '<div class="seg">' + seg('all', 'Todos') + seg('in', 'Ingresos') + seg('out', 'Gastos') + '</div>' +
    '<div class="card" style="padding:2px 18px;margin-bottom:12px"><button class="linkrow" data-act="add"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A6CFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>Añadir movimiento</button></div>' +
    '<div class="card" style="padding-top:6px;padding-bottom:6px">' + (rows || '<div class="empty">Sin movimientos</div>') + '</div>' +
    '';
}

function renderAll() { renderResumen(); renderDeuda(); renderProyeccion(); renderMovimientos(); }

/* ---------- Navegación ---------- */
function setTab(t) {
  ui.tab = t;
  ['resumen', 'deuda', 'proyeccion', 'movimientos'].forEach((k) => $('#s-' + k).classList.toggle('active', k === t));
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.getAttribute('data-act') === 'tab:' + t));
  if (typeof movePill === 'function') movePill();
}
let toastTimer = 0;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- Hoja para añadir movimientos ---------- */
function sheetHTML(keep) {
  const k = keep || {};
  const cats = ui.sheetType === 'out'
    ? '<div class="chips">' + CAT_ORDER.map((c) => '<button class="chip' + (ui.sheetCat === c ? ' on' : '') + '" data-act="cat:' + c + '">' + c + '</button>').join('') + '</div>'
    : '';
  const seg = (k2, label) => '<button class="' + (ui.sheetType === k2 ? 'on' : '') + '" data-act="type:' + k2 + '">' + label + '</button>';
  return '<div class="grab"></div><h2>Nuevo movimiento</h2>' +
    '<div class="seg" style="margin-bottom:8px">' + seg('out', 'Gasto') + seg('in', 'Ingreso') + '</div>' +
    '<div class="amount"><span>$</span><input id="fAmount" inputmode="decimal" placeholder="0.00" autocomplete="off" value="' + esc(k.amount || '') + '"></div>' + cats +
    '<input class="field" id="fNote" placeholder="Nota (opcional)" autocomplete="off" value="' + esc(k.note || '') + '">' +
    '<input class="field" id="fDate" type="date" value="' + esc(k.date || iso(getToday())) + '">' +
    '<button class="primary" data-act="submit">Añadir</button>';
}
function openSheet() {
  ui.sheetType = 'out'; ui.sheetCat = 'Comida';
  $('#sheet').innerHTML = sheetHTML();
  $('#sheet').classList.add('show'); $('#backdrop').classList.add('show');
}
function settingsHTML() {
  const st = data.settings;
  const blue = (i) => i.replace(/#1C1C1E/g, '#0A6CFF');
  return '<div class="grab"></div><h2>Ajustes</h2>' +
    '<div class="sub" style="padding:0 2px 8px">finanzas.json · ' + (ui.dirty > 0 ? plural(ui.dirty, 'cambio', 'cambios') + ' sin guardar' : 'todo guardado') + '</div>' +
    '<button class="linkrow" data-act="load">' + blue(ICON.folder) + 'Cargar archivo</button>' +
    '<button class="linkrow" data-act="save">' + blue(ICON.save) + 'Guardar archivo</button>' +
    '<div class="row"><span class="grow" style="font-size:17px">Gasto variable por semana</span><input class="mini" id="sVar" inputmode="decimal" value="' + (st.variable_weekly || 0) + '"></div>' +
    '<div class="row"><span class="grow" style="font-size:17px">Colchón mínimo</span><input class="mini" id="sCush" inputmode="decimal" value="' + (st.cushion || 0) + '"></div>' +
    '<button class="linkrow" data-act="reset" style="color:#FF3B30;margin-top:4px">Restaurar datos de ejemplo</button>';
}
function openSettings() {
  $('#sheet').innerHTML = settingsHTML();
  $('#sheet').classList.add('show'); $('#backdrop').classList.add('show');
}
function closeSheet() { $('#sheet').classList.remove('show'); $('#backdrop').classList.remove('show'); }
function readSheet() {
  return { amount: ($('#fAmount') || {}).value || '', note: ($('#fNote') || {}).value || '', date: ($('#fDate') || {}).value || '' };
}
function submitSheet() {
  const v = readSheet();
  const amt = parseFloat(String(v.amount).replace(',', '.'));
  if (!(amt > 0)) { toast('Escribe un monto'); return; }
  const out = ui.sheetType === 'out';
  const cat = out ? ui.sheetCat : 'Ingreso';
  const id = 1 + Math.max.apply(null, data.transactions.map((t) => t.id || 0).concat([0]));
  data.transactions.push({ id: id, date: v.date || iso(getToday()), amount: out ? -amt : amt, category: cat, note: v.note.trim() || (out ? cat : 'Ingreso') });
  data.accounts[0].balance = Math.round((data.accounts[0].balance + (out ? -amt : amt)) * 100) / 100;
  ui.dirty++; persist(); closeSheet(); renderAll(); toast('Movimiento añadido');
}

/* ---------- Archivo (save file) ---------- */
async function saveFile() {
  const file = new File([JSON.stringify(data, null, 2)], 'finanzas.json', { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'finanzas.json' });
      markSaved(); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = 'finanzas.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  markSaved();
}
function markSaved() { ui.dirty = 0; persist(); renderResumen(); toast('Archivo guardado'); }

/* ---------- Eventos ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act'), parts = act.split(':'), a = parts[0], arg = parts.slice(1).join(':');
  if (a === 'tab') setTab(arg);
  else if (a === 'add') openSheet();
  else if (a === 'settings') openSettings();
  else if (a === 'close') closeSheet();
  else if (a === 'type') { const k = readSheet(); ui.sheetType = arg; $('#sheet').innerHTML = sheetHTML(k); }
  else if (a === 'cat') { const k = readSheet(); ui.sheetCat = arg; $('#sheet').innerHTML = sheetHTML(k); }
  else if (a === 'submit') submitSheet();
  else if (a === 'load') $('#file').click();
  else if (a === 'save') saveFile();
  else if (a === 'mov') { ui.mov = arg; renderMovimientos(); }
  else if (a === 'interest') { ui.interest = !ui.interest; renderDeuda(); }
  else if (a === 'sim') toast('El simulador llega en la próxima versión');
  else if (a === 'toggle') {
    ui.variable = !ui.variable;
    el.classList.toggle('on', ui.variable); el.setAttribute('aria-checked', String(ui.variable));
    updateProjection();
  }
  else if (a === 'reset') {
    data = clone(SAMPLE); ui.dirty = 0; persist(); closeSheet(); renderAll(); toast('Datos de ejemplo restaurados');
  }
});
document.addEventListener('input', (e) => {
  if (e.target && e.target.id === 'weekRange') { ui.week = Number(e.target.value); updateProjection(); }
});
document.addEventListener('change', (e) => {
  const id = e.target && e.target.id;
  if (id !== 'sVar' && id !== 'sCush') return;
  const v = parseFloat(String(e.target.value).replace(',', '.'));
  if (!(v >= 0)) { toast('Valor no válido'); return; }
  data.settings[id === 'sVar' ? 'variable_weekly' : 'cushion'] = v;
  ui.dirty++; persist(); renderAll(); toast('Ajuste guardado');
});
$('#file').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  try {
    data = migrate(JSON.parse(await f.text()));
    ui.dirty = 0; persist(); closeSheet(); renderAll(); toast('Archivo cargado');
  } catch (err) { toast('No pude leer ese archivo'); }
  e.target.value = '';
});

/* ---------- Píldora Liquid Glass: resorte, burbuja al mantener, arrastre y reflejo ---------- */
const tabbar = $('#tabbar'), pill = $('#pill');
const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const P = { x: 0, w: 0, vx: 0, vw: 0, tx: 0, tw: 0, s: 1, vs: 0, ts: 1, raf: 0, last: 0, bubble: false, drag: false };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function activeTab() { return tabbar.querySelector('.tab.on'); }
function draw() {
  const st = 1 + Math.min(0.18, Math.abs(P.vx) / 4000);
  pill.style.width = P.w + 'px';
  pill.style.transform = 'translate3d(' + P.x.toFixed(2) + 'px,0,0) scale(' + (P.s * st).toFixed(3) + ',' + (P.s / (1 + (st - 1) * 0.5)).toFixed(3) + ') skewX(' + clamp(-P.vx / 70, -9, 9).toFixed(2) + 'deg)';
}
function kick() { if (!P.raf) { P.last = performance.now(); P.raf = requestAnimationFrame(step); } }
function step(t) {
  const dt = Math.min(0.032, (t - P.last) / 1000); P.last = t;
  const sp = (k, c, key, vkey, target) => { const a = k * (target - P[key]) - c * P[vkey]; P[vkey] += a * dt; P[key] += P[vkey] * dt; };
  sp(320, 26, 'x', 'vx', P.tx); sp(320, 26, 'w', 'vw', P.tw); sp(260, 18, 's', 'vs', P.ts);
  draw();
  const done = Math.abs(P.tx - P.x) < 0.2 && Math.abs(P.tw - P.w) < 0.2 && Math.abs(P.ts - P.s) < 0.002 && Math.abs(P.vx) < 2 && Math.abs(P.vw) < 2 && Math.abs(P.vs) < 0.05;
  if (done && !P.drag) { P.x = P.tx; P.w = P.tw; P.s = P.ts; P.vx = P.vw = P.vs = 0; draw(); P.raf = 0; return; }
  P.raf = requestAnimationFrame(step);
}
function movePill(jump) {
  const el = activeTab(); if (!el) return;
  if (!P.drag) { P.tx = el.offsetLeft; P.tw = el.offsetWidth; }
  if (jump || reduce || P.w === 0) { P.x = P.tx; P.w = P.tw; P.vx = P.vw = 0; draw(); } else kick();
}
function setLight(clientX) {
  const r = tabbar.getBoundingClientRect();
  tabbar.style.setProperty('--lx', clamp(((clientX - r.left) / r.width) * 100, 0, 100).toFixed(1) + '%');
}
let gyro = false;
function onTilt(e) { if (e.gamma != null) tabbar.style.setProperty('--lx', ((0.5 + clamp(e.gamma, -30, 30) / 60) * 100).toFixed(1) + '%'); }
function askGyro() {
  if (gyro || !window.DeviceOrientationEvent) return; gyro = true;
  try {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then((r) => { if (r === 'granted') window.addEventListener('deviceorientation', onTilt); }).catch(() => {});
    } else window.addEventListener('deviceorientation', onTilt);
  } catch (e) { /* sin giroscopio */ }
}
let holdT = 0, startX = 0, suppress = false;
tabbar.addEventListener('pointerdown', (e) => {
  askGyro(); setLight(e.clientX);
  const t = e.target.closest('.tab'); if (!t) return;
  startX = e.clientX;
  if (t.classList.contains('on') && !reduce) {
    holdT = setTimeout(() => {
      P.bubble = true; P.drag = true; P.ts = 1.16; pill.classList.add('bubble');
      try { tabbar.setPointerCapture(e.pointerId); } catch (err) { /* sin captura */ }
      if (navigator.vibrate) navigator.vibrate(8);
      kick();
    }, 260);
  }
});
tabbar.addEventListener('pointermove', (e) => {
  setLight(e.clientX);
  if (!P.bubble) { if (Math.abs(e.clientX - startX) > 8) clearTimeout(holdT); return; }
  const r = tabbar.getBoundingClientRect(), k = r.width / tabbar.offsetWidth;
  P.tx = clamp((e.clientX - r.left) / k - P.tw / 2, 4, tabbar.offsetWidth - P.tw - 4);
  kick();
});
function endPress() {
  clearTimeout(holdT);
  if (!P.bubble) return;
  const c = P.tx + P.tw / 2, tabs = Array.prototype.slice.call(tabbar.querySelectorAll('.tab'));
  let best = tabs[0], bd = 1e9;
  tabs.forEach((t) => { const d = Math.abs(t.offsetLeft + t.offsetWidth / 2 - c); if (d < bd) { bd = d; best = t; } });
  P.bubble = false; P.drag = false; P.ts = 1; pill.classList.remove('bubble');
  suppress = true; setTimeout(() => { suppress = false; }, 0);
  setTab(best.getAttribute('data-act').split(':')[1]);
}
tabbar.addEventListener('pointerup', endPress);
tabbar.addEventListener('pointercancel', endPress);
tabbar.addEventListener('click', (e) => { if (suppress) { e.stopPropagation(); e.preventDefault(); } }, true);
window.addEventListener('resize', () => movePill(true));

/* ---------- Arranque ---------- */
if (/[?&]preview/.test(location.search)) document.documentElement.classList.add('preview');
function fitFrame() {
  const s = window.innerWidth >= 600 ? Math.min(1, (window.innerHeight - 48) / 874) : 1;
  document.documentElement.style.setProperty('--s', String(s));
}
window.addEventListener('resize', fitFrame); fitFrame();
renderAll(); setTab('resumen'); movePill(true);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => movePill(true));
})();
</script>
</body>
</html>
