input{font:inherit;letter-spacing:inherit;color:inherit}
svg{display:block}

/* Pantallas */
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:calc(var(--sat) + 8px) 16px calc(var(--sab) + 116px);display:none;scrollbar-width:none;-webkit-mask-image:linear-gradient(to bottom,transparent calc(var(--sat) - 6px),#000 calc(var(--sat) + 26px),#000 calc(100% - var(--sab) - 104px),transparent calc(100% - 4px));mask-image:linear-gradient(to bottom,transparent calc(var(--sat) - 6px),#000 calc(var(--sat) + 26px),#000 calc(100% - var(--sab) - 104px),transparent calc(100% - 4px))}
.screen::-webkit-scrollbar{display:none}

function genEvents(today, o) {
  const end = addDays(today, 84), ev = [];
  const monthly = (day, fn) => {
    for (let k = 0; k <= 3; k++) {
      const base = new Date(today.getFullYear(), today.getMonth() + k, 1);
      const last = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
      const d = new Date(base.getFullYear(), base.getMonth(), Math.min(day, last));
      if (d > today && d <= end) fn(d);

  };
  data.recurring.forEach((r) => monthly(r.day || 1, (d) => ev.push({ date: d, name: r.name, amt: r.amount, type: 'rec' })));
  data.subs.forEach((s) => monthly(s.day || 1, (d) => ev.push({ date: d, name: s.name, amt: -usd(s.amount, s.cur), type: 'sub' })));
  data.cards.forEach((c) => { if (c.payment > 0) monthly(c.due_day || 1, (d) => ev.push({ date: d, name: 'Pago ' + c.name, amt: -usd(c.payment, c.cur), type: 'card' })); });
  [[data.expected_income, 1, 'in'], [data.expected_expense, -1, 'exp']].forEach((g) => g[0].forEach((e) => {
    const amt = g[1] * usd(e.amount, accOf(e.acc).cur);
    let d = pd(e.date), n = 0;
    if (d <= today) ev.push({ date: addDays(today, 1), name: e.name, amt: amt, type: g[2], pending: true, orig: e.date });
    else if (d <= end) ev.push({ date: d, name: e.name, amt: amt, type: g[2] });
    if (e.repeat) {
      d = nextRep(d, e.repeat);
      while (d <= today && n++ < 400) d = nextRep(d, e.repeat);
      n = 0;
      while (d <= end && n++ < 400) { ev.push({ date: d, name: e.name, amt: amt, type: g[2] }); d = nextRep(d, e.repeat); }
    }
  }));
  data.planned.forEach((p) => { if (p.on === false || (o && (o.noSim || o.skip === p.id))) return; const d = pd(p.date); if (d > today && d <= end) ev.push({ date: d, name: p.name, amt: p.amount, type: 'sim' }); });
  return ev.sort((a, b) => a.date - b.date);
}

function projection() {
  const c = calc();
  const V = ui.variable ? (data.settings.variable_weekly || 0) : 0;
  const events = genEvents(c.today);
  const series = [];
  for (let i = 0; i <= 12; i++) {
    const end = addDays(c.today, 7 * i);
    let s = 0;
    events.forEach((e) => { if (e.date <= end) s += e.amt; });
    series.push({ date: end, v: c.balance + s - V * i });
  }
  let cum = 0;
  const timeline = events.slice(0, 8).map((e) => {
    cum += e.amt;
    const days = Math.round((e.date - c.today) / 86400000);
    return { name: e.name, date: dlabel(e.date), amt: e.amt, type: e.type, after: c.balance + cum - (V * days) / 7 };
  });
  const minV = Math.min.apply(null, series.map((s) => s.v));

  return { c, series, timeline, minV, firstRed, V };
}

/* Simulador de pago de deudas: se paga el mínimo en todas y lo extra va a la de mayor interés */
function payoff(extra) {
  const ds = data.cards.map((k) => ({ b: usd(k.balance, k.cur), r: k.apr / 1200, apr: k.apr, p: k.payment > 0 ? usd(k.payment, k.cur) : Math.max(15, usd(k.balance, k.cur) * 0.02) })).filter((d) => d.b > 0);
  if (!ds.length) return { months: 0, interest: 0, ok: true };
  const pool = sum(ds, (d) => d.p) + extra;
  let interest = 0, m = 0;
  while (m < 600 && ds.some((d) => d.b > 0.005)) {
    m++;
    ds.forEach((d) => { if (d.b > 0) { const i = d.b * d.r; d.b += i; interest += i; } });
    let rest = pool;
    ds.forEach((d) => { const x = Math.min(d.p, d.b); d.b -= x; rest -= x; });
    ds.slice().sort((a, b) => b.apr - a.apr).forEach((d) => { if (rest > 0 && d.b > 0) { const x = Math.min(rest, d.b); d.b -= x; rest -= x; } });
  }
  return { months: m, interest: interest, ok: !ds.some((d) => d.b > 0.005) };
}

  const budgetCard = '<div class="card"><div class="lbl">Presupuesto de ' + MON_FULL[c.today.getMonth()] + '</div>' +

    '<div class="bar" style="height:8px;border-radius:4px;margin:10px 0 8px"><i style="height:8px;border-radius:4px;width:' + pct + '%;background:' + (left < 0 ? '#FF3B30' : '#0A6CFF') + '"></i></div>' +

function renderPresupuesto() {
  const c = calc(), left = c.budgetTotal - c.expense, dl = c.dim - c.today.getDate() + 1;
  const center = c.budgetTotal
    ? '<text x="120" y="112" text-anchor="middle" font-size="13" fill="#6C6C70" font-family="inherit">' + (left >= 0 ? 'Quedan' : 'Pasado') + '</text><text x="120" y="144" text-anchor="middle" font-size="30" font-weight="700" letter-spacing="-0.9" fill="' + (left >= 0 ? '#1C1C1E' : '#D70015') + '" font-family="inherit">' + fmt(Math.abs(left)) + '</text><text x="120" y="166" text-anchor="middle" font-size="12" fill="#6C6C70" font-family="inherit">de ' + fmt(c.budgetTotal) + '</text>'
    : '<text x="120" y="112" text-anchor="middle" font-size="13" fill="#6C6C70" font-family="inherit">Gastado</text><text x="120" y="144" text-anchor="middle" font-size="30" font-weight="700" fill="#1C1C1E" font-family="inherit">' + fmt(c.expense) + '</text>';
  const ring = ringSVG(c.cats.length ? c.cats : [], 100, 22, 4, 240, center);
  const rows = CAT_ORDER.map((k) => {
    const lim = data.budget[k] || 0, sp = c.catTot[k] || 0, pct = lim ? sp / lim : 0, over = lim && sp > lim;
    const col = over ? '#FF3B30' : pct > 0.85 ? '#FF9F0A' : CAT_COLOR[k];
    return rowEdit('budget', k, tile(CAT_COLOR[k], catGlyph(k)),
      '<div class="name" style="font-size:16px">' + k + '</div><div class="bar"><i style="width:' + Math.min(100, pct * 100) + '%;background:' + col + '"></i></div><div class="sub" style="font-size:13px">' + fmt(sp) + (lim ? ' de ' + fmt(lim) : ' · sin límite') + '</div>',
      lim ? '<span class="amt" style="color:' + (over ? '#D70015' : '#1C1C1E') + '">' + fmt(lim - sp) + '</span>' : '<span class="sub">Definir</span>');
  }).join('');
  const subRows = data.subs.slice().sort((a, b) => a.day - b.day).map((s, i) => rowEdit('sub', s.id, tile(CARD_COLORS[i % CARD_COLORS.length], esc(s.name).charAt(0)),
    '<div class="name" style="font-size:16px">' + esc(s.name) + '</div><div class="sub" style="font-size:13px">Día ' + s.day + ' de cada mes' + (s.cur === 'PEN' ? ' · ≈ ' + fmt2(usd(s.amount, s.cur)) : '') + '</div>',
    '<span class="amt">' + fmtC2(s.amount, s.cur) + '</span>')).join('');
  $('#s-presupuesto').innerHTML =
    '<div class="head"><div><div class="eyebrow">' + (c.budgetTotal ? 'Quedan ' + dl + (dl === 1 ? ' día' : ' días') + ' del mes' : 'Planifica tu mes') + '</div><h1>Presupuesto</h1></div></div>' +
    '<div class="card"><div style="max-width:240px;margin:0 auto">' + ring + '</div>' +
      (c.budgetTotal && left > 0 ? '<div class="sub" style="text-align:center;padding-top:6px">Puedes gastar unos <b style="color:#1C1C1E">' + fmt(left / dl) + '</b> al día</div>' : '') + '</div>' +
    '<div class="card"><div class="lbl" style="padding-bottom:4px">Límites por categoría</div>' + rows + addRow('budget', 'Añadir categoría') + '</div>' +
    '<div class="card"><div class="lbl">Suscripciones</div><div class="big" style="font-size:28px;margin:2px 0 4px">' + fmt2(c.subsTotal) + ' <span class="sub" style="font-weight:500;letter-spacing:0">al mes</span></div>' +
      '<div class="sub" style="padding-bottom:4px">' + fmt2(c.subsTotal * 12) + ' al año</div>' + subRows + addRow('sub', 'Añadir suscripción') + '</div>';
}

      '<div class="sub" style="font-size:13px">' + (s.goal > 0 ? Math.round(pct) + '% de ' + fmtC(s.goal, s.cur) + ' · ' : '') + eta + '</div>',

function renderProyeccion() {
  const c = calc(), est = data.transactions.filter((t) => t.est > 0 && t.amount > 0);
  const avgVar = est.length ? sum(est, (t) => usd(t.amount - t.est, accOf(t.acc).cur)) / est.length : 0;
  const pend = pendingIncomes().map((e) => e.id);
  const inRows = data.expected_income.slice().sort((a, b) => (a.date < b.date ? -1 : 1)).map((e) => {
    const cur = accOf(e.acc).cur, due = pend.indexOf(e.id) >= 0;
    return rowEdit('income', e.id, tile('#4CC38A', esc(e.name).charAt(0)),
      '<div class="name" style="font-size:16px">' + esc(e.name) + (due ? ' <span class="badge" style="background:#FFF1D6;color:#8A5100;padding:2px 8px;font-size:12px">Por confirmar</span>' : '') + '</div><div class="sub" style="font-size:13px">' + dlabel(pd(e.date)) + ' · ' + repLabel(e.repeat) + '</div>',
      '<span class="amt" style="color:#248A3D;font-weight:600">+' + fmtC(e.amount, cur) + '</span>');
  }).join('');
  const pendX = pendingItems().filter((x) => x.k === 'out').map((x) => x.e.id);
  const exRows = data.expected_expense.slice().sort((a, b) => (a.date < b.date ? -1 : 1)).map((e) => {
    const cur = accOf(e.acc).cur, due = pendX.indexOf(e.id) >= 0, ec = CAT_ORDER.indexOf(e.cat) >= 0 ? e.cat : 'Otros';
    return rowEdit('expense', e.id, tile(CAT_COLOR[ec], catGlyph(ec)),
      '<div class="name" style="font-size:16px">' + esc(e.name) + (due ? ' <span class="badge" style="background:#FFF1D6;color:#8A5100;padding:2px 8px;font-size:12px">Por confirmar</span>' : '') + '</div><div class="sub" style="font-size:13px">' + dlabel(pd(e.date)) + ' · ' + repLabel(e.repeat) + ' · ' + esc(ec) + '</div>',
      '<span class="amt" style="font-weight:600">−' + fmtC(e.amount, cur) + '</span>');
  }).join('');
  const impactHTML = (p) => {
    if (p.on === false) return '';
    const im = simImpact(p); if (!im) return '';
    const tag = { red: ['#FFE5E3', '#D70015', 'Te deja en rojo'], amber: ['#FFF1D6', '#8A5100', 'Bajo tu colchón'], ok: ['#E4F6EA', '#1E7B3A', 'Sin problema'] }[im.status];
    return '<div class="sub" style="font-size:13px;padding-top:2px">Del ' + dshort(pd(im.start)) + ' al ' + dshort(pd(im.end)) + ' · mínimo ' + fmt(im.withMin) + ' el ' + dshort(im.withDate) + ' (sin esto: ' + fmt(im.withoutMin) + ')</div><span class="badge" style="margin-top:4px;background:' + tag[0] + ';color:' + tag[1] + ';padding:2px 8px;font-size:12px">' + tag[2] + '</span>';
  };

async function saveFile() {

    }

/* ---------- Lente Liquid Glass: resorte, lente al presionar, arrastre y reflejo ---------- */
const tabbar = $('#tabbar'), tabsEl = $('#tabs'), barbg = $('#barbg'), pill = $('#pill');
const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const P = { x: 0, w: 0, vx: 0, vw: 0, tx: 0, tw: 0, s: 1, vs: 0, ts: 1, raf: 0, last: 0, bubble: false, drag: false, on: false };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const tabX = (el) => el.offsetLeft + tabsEl.offsetLeft;
function draw() {
  const st = 1 + Math.min(0.12, Math.abs(P.vx) / 5000);
  const sx = P.s * st, sy = P.s / (1 + (st - 1) * 0.5);
  pill.style.width = P.w + 'px';
  pill.style.transform = 'translate3d(' + P.x.toFixed(2) + 'px,0,0) scale(' + sx.toFixed(3) + ',' + sy.toFixed(3) + ') skewX(' + clamp(-P.vx / 90, -5, 5).toFixed(2) + 'deg)';
}
function kick() { if (!P.raf) { P.last = performance.now(); P.raf = requestAnimationFrame(step); } }
function step(t) {
  const dt = Math.min(0.032, (t - P.last) / 1000); P.last = t;
  const sp = (k, c, key, vkey, target) => { const a = k * (target - P[key]) - c * P[vkey]; P[vkey] += a * dt; P[key] += P[vkey] * dt; };
  sp(320, 26, 'x', 'vx', P.tx); sp(320, 26, 'w', 'vw', P.tw); sp(240, 17, 's', 'vs', P.ts);
  draw();
  const done = Math.abs(P.tx - P.x) < 0.2 && Math.abs(P.tw - P.w) < 0.2 && Math.abs(P.ts - P.s) < 0.002 && Math.abs(P.vx) < 2 && Math.abs(P.vw) < 2 && Math.abs(P.vs) < 0.05;
  if (done && !P.drag) { P.x = P.tx; P.w = P.tw; P.s = P.ts; P.vx = P.vw = P.vs = 0; draw(); P.raf = 0; return; }
  P.raf = requestAnimationFrame(step);
}
function movePill(jump) {
  const el = tabbar.querySelector('.tab.on'); if (!el) return;
  if (!P.drag) { P.tx = tabX(el); P.tw = el.offsetWidth; }
  if (jump || reduce || P.w === 0) { P.x = P.tx; P.w = P.tw; P.vx = P.vw = 0; draw(); } else kick();
}
function setLight(clientX) {
  const r = tabbar.getBoundingClientRect();
  tabbar.style.setProperty('--lx', clamp(((clientX - r.left) / r.width) * 100, 0, 100).toFixed(1) + '%');
}
let gyro = false;
function onTilt(e) { if (e.gamma != null) tabbar.style.setProperty('--lx', ((0.5 + clamp(e.gamma, -30, 30) / 60) * 100).toFixed(1) + '%'); }
function askGyro() {
  if (gyro || !window.DeviceOrientationEvent) return; gyro = true;
  try {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then((r) => { if (r === 'granted') window.addEventListener('deviceorientation', onTilt); }).catch(() => {});
    } else window.addEventListener('deviceorientation', onTilt);
  } catch (e) { /* sin giroscopio */ }
}
let holdT = 0, startX = 0, suppress = false;
let heldT = 0;
tabbar.addEventListener('pointerdown', (e) => {
  askGyro(); setLight(e.clientX);
  clearTimeout(heldT); heldT = setTimeout(() => tabbar.classList.add('held'), 90);
  const t = e.target.closest('.tab'); if (!t) return;
  startX = e.clientX;
  if (t.classList.contains('on') && !reduce) {
    holdT = setTimeout(() => {
      P.bubble = true; P.drag = true; P.ts = 1.1; tabbar.classList.add('pressing');
      try { tabbar.setPointerCapture(e.pointerId); } catch (err) { /* sin captura */ }
      if (navigator.vibrate) navigator.vibrate(8);
      kick();
    }, 90);
  }
});
tabbar.addEventListener('pointermove', (e) => {
  setLight(e.clientX);
  if (!P.bubble) return;
  const r = tabbar.getBoundingClientRect(), k = r.width / tabbar.offsetWidth;
  P.tx = clamp((e.clientX - r.left) / k - P.tw / 2, 2, tabbar.clientWidth - P.tw - 2);
  kick();
});
function endPress() {
  clearTimeout(holdT);
  if (!P.bubble) return;
  const c = P.tx + P.tw / 2, tabs = Array.prototype.slice.call(tabbar.querySelectorAll('.tab'));
  let best = tabs[0], bd = 1e9;
  tabs.forEach((t) => { const d = Math.abs(tabX(t) + t.offsetWidth / 2 - c); if (d < bd) { bd = d; best = t; } });
  P.bubble = false; P.drag = false; P.ts = 1; tabbar.classList.remove('pressing');
  suppress = true; setTimeout(() => { suppress = false; }, 0);
  setTab(best.getAttribute('data-act').split(':')[1]);
  kick();
}
function release() { clearTimeout(heldT); tabbar.classList.remove('held'); endPress(); }
tabbar.addEventListener('pointerup', release);
tabbar.addEventListener('pointercancel', release);
tabbar.addEventListener('pointerleave', () => { if (!P.bubble) { clearTimeout(heldT); clearTimeout(holdT); tabbar.classList.remove('held'); } });
tabbar.addEventListener('click', (e) => { if (suppress) { e.stopPropagation(); e.preventDefault(); } }, true);
window.addEventListener('resize', () => movePill(true));

/* Minimizar la barra al bajar y restaurarla al subir (como Instagram) */
function setMini(on) { tabbar.classList.toggle('compact', on); }
document.querySelectorAll('.screen').forEach((sc) => {
  let last = 0, acc = 0;
  sc.addEventListener('scroll', () => {
    const y = sc.scrollTop, dy = y - last; last = y;
    if (y < 24) { acc = 0; setMini(false); return; }
    if ((dy > 0) !== (acc > 0)) acc = 0;
    acc += dy;
    if (acc > 14) setMini(true); else if (acc < -10) setMini(false);
  }, { passive: true });
});
if (typeof ResizeObserver === 'function') new ResizeObserver(() => { if (!P.drag) movePill(true); if (typeof placeGhost === 'function') placeGhost(); }).observe(tabbar);


/* ---------- Efecto lupa en los bordes (sin filtros SVG, funciona en Safari) ----------
   Cada borde de la barra se divide en dos franjas con copias del contenido de atrás: la exterior invertida
   y la interior ampliada, empalmadas para que no haya saltos. */
const deviceEl = $('#device');
const E1 = 2.5, E2 = 8, S1 = -1.15, S2 = 1.4, CB1 = E2 + (E1 - E2) / S2;
function makeRefract(host) {
  const refract = host.querySelector('.refract'), bands = [];
  ['t', 'b', 'l', 'r'].forEach((side) => {
    [{ a: 0, b: E1, s: S1, lb: E1, cb: CB1 }, { a: E1, b: E2, s: S2, lb: E2, cb: E2 }].forEach((sp) => {
      const el = document.createElement('div'), gh = document.createElement('div');
      el.className = 'band s-' + side + (sp.a ? ' in' : ''); gh.className = 'ghost'; el.appendChild(gh); refract.appendChild(el);
      bands.push({ side: side, sp: sp, el: el, gh: gh });
    });
  });
  return { host: host, bands: bands };
}
const lensHosts = [makeRefract(tabbar), makeRefract($('#gearbtn')), makeRefract($('#plusbtn'))];
function placeGhost() {
  const sc = document.querySelector('.screen.active'), st = sc ? sc.scrollTop : 0, gw = deviceEl.clientWidth + 'px';
  lensHosts.forEach((h) => {
    const L = h.host.offsetLeft, T = h.host.offsetTop, W = h.host.offsetWidth, H = h.host.offsetHeight;
    h.bands.forEach((bd) => {
      const sp = bd.sp, s = sp.s, a = sp.a, b = sp.b, e = bd.el.style, g = bd.gh.style;
      g.width = gw;
      if (bd.side === 't') {
        e.left = '0px'; e.top = a + 'px'; e.width = W + 'px'; e.height = (b - a) + 'px';
        g.transform = 'translate3d(' + (-L) + 'px,' + (sp.lb - a - s * (T + sp.cb + st)).toFixed(2) + 'px,0) scale(1,' + s + ')';
      } else if (bd.side === 'b') {
        e.left = '0px'; e.top = (H - b) + 'px'; e.width = W + 'px'; e.height = (b - a) + 'px';
        g.transform = 'translate3d(' + (-L) + 'px,' + (H - sp.lb - s * (H - sp.cb) - s * (st + T) - (H - b)).toFixed(2) + 'px,0) scale(1,' + s + ')';
      } else if (bd.side === 'l') {
        e.left = a + 'px'; e.top = '0px'; e.width = (b - a) + 'px'; e.height = H + 'px';
        g.transform = 'translate3d(' + (sp.lb - a - s * (L + sp.cb)).toFixed(2) + 'px,' + (-T - st) + 'px,0) scale(' + s + ',1)';
      } else {
        e.left = (W - b) + 'px'; e.top = '0px'; e.width = (b - a) + 'px'; e.height = H + 'px';
        g.transform = 'translate3d(' + (W - sp.lb - s * (W - sp.cb) - s * L - (W - b)).toFixed(2) + 'px,' + (-T - st) + 'px,0) scale(' + s + ',1)';
      }
    });
  });
}
let ghostRaf = 0;
function syncGhost() {
  if (ghostRaf) return;
  ghostRaf = requestAnimationFrame(() => {
    ghostRaf = 0;
    const sc = document.querySelector('.screen.active');
    if (sc) { const html = sc.innerHTML.replace(/ id="[^"]*"/g, '').replace(/ data-act="[^"]*"/g, ''); lensHosts.forEach((h) => h.bands.forEach((bd) => { bd.gh.innerHTML = html; })); }
    placeGhost();
  });
}
if (typeof MutationObserver === 'function') new MutationObserver(syncGhost).observe($('main'), { subtree: true, childList: true, characterData: true, attributes: true });
document.querySelectorAll('.screen').forEach((sc) => sc.addEventListener('scroll', placeGhost, { passive: true }));
window.addEventListener('resize', syncGhost);
syncGhost();
