e qui se voit."], ["Muy buen mes. Estás cerca de la excelencia; un pequeño ajuste en tus gastos más grandes te llevaría a la cima. Ya casi lo tienes.", "A very good month. You’re close to excellence; a small tweak to your biggest expenses would take you to the top. You’re almost there.", "とても良い月でした。あと一歩で最高評価です。大きな支出を少し見直せば頂点に届きます。もう少しです。", "Un ottimo mese. Sei vicino all’eccellenza; un piccolo aggiustamento alle tue spese più grandi ti porterebbe in vetta. Ci sei quasi.", "Un très bon mois. Vous êtes proche de l’excellence ; un petit ajustement de vos plus grosses dépenses vous mènerait au sommet. Vous y êtes presque."], ["Vas por buen camino. Aún hay margen para mejorar: revisa las categorías que más subieron y sigue avanzando. Cada mes cuenta.", "You’re on the right track. There’s still room to improve: review the categories that went up the most and keep moving forward. Every month counts.", "順調です。まだ改善の余地があります。最も増えたカテゴリを見直して、前進を続けましょう。毎月が大切です。", "Sei sulla strada giusta. C’è ancora margine di miglioramento: controlla le categorie che sono salite di più e continua ad avanzare. Ogni mese conta.", "Vous êtes sur la bonne voie. Il y a encore une marge de progression : examinez les catégories qui ont le plus augmenté et continuez d’avancer. Chaque mois compte."], ["Un mes intermedio. No está mal, pero puedes hacerlo mejor: elige una categoría para recortar y mira cómo cambia tu nota. Los grandes cambios empiezan con uno pequeño.", "An average month. Not bad, but you can do better: pick a category to cut back and see how your grade changes. Big changes start small.", "平均的な月でした。悪くありませんが、もっとできます。減らすカテゴリを1つ選んで、評価がどう変わるか見てみましょう。大きな変化は小さな一歩から始まります。", "Un mese nella media. Non male, ma puoi fare meglio: scegli una categoria da ridurre e guarda come cambia il tuo voto. I grandi cambiamenti iniziano da uno piccolo.", "Un mois moyen. Pas mal, mais vous pouvez faire mieux : choisissez une catégorie à réduire et voyez comment votre note évolue. Les grands changements commencent par un petit."], ["Este mes se complicó, pero estás a tiempo de corregir. Empieza por tu mayor gasto y celebra cada pequeño avance. Un mes más ordenado cambia el panorama.", "This month got complicated, but you still have time to fix it. Start with your biggest expense and celebrate every small step forward. One more organized month changes the picture.", "今月は厳しい月でしたが、まだ立て直せます。最大の支出から手をつけて、小さな前進を大切にしましょう。整った1か月で状況は変わります。", "Questo mese si è complicato, ma sei ancora in tempo per correggere. Parti dalla tua spesa maggiore e celebra ogni piccolo passo avanti. Un mese più ordinato cambia il quadro.", "Ce mois s’est compliqué, mais vous avez encore le temps de corriger. Commencez par votre plus grosse dépense et célébrez chaque petit progrès. Un mois mieux organisé change la donne."], ["Un mal mes no define tu camino. Empieza de nuevo con un plan simple: un límite por categoría y un pequeño aporte a tus metas. Lo importante es seguir intentando.", "A bad month doesn’t define your path. Start again with a simple plan: a limit per category and a small contribution to your goals. What matters is to keep trying.", "悪い月があっても道が決まるわけではありません。シンプルな計画でやり直しましょう。カテゴリごとの上限と、目標への少額の積立です。大切なのは挑戦し続けること。", "Un brutto mese non definisce il tuo percorso. Ricomincia con un piano semplice: un limite per categoria e un piccolo versamento sui tuoi obiettivi. L’importante è continuare a provarci.", "Un mauvais mois ne définit pas votre parcours. Repartez avec un plan simple : une limite par catégorie et un petit versement vers vos objectifs. L’important est de continuer d’essayer."], ["Evaluación", "Grade", "評価", "Valutazione", "Évaluation"], ["No hay forma de que tengas tanto dinero, y si lo tienes, felicidades.", "There’s no way you have that much money, and if you do, congratulations.", "そんなにお金を持っているはずがありません。もし本当なら、おめでとうございます。", "Non è possibile che tu abbia così tanti soldi, e se è così, congratulazioni.", "Impossible que vous ayez autant d’argent, et si c’est le cas, félicitations."], ["Có function creditsHTML() {
  const role = (n, r) => '<div class="row" style="border:0"><div class="grow"><div class="name" style="font-size:17px">' + n + '</div><div class="sub" style="font-size:14px;margin-top:1px">' + r + '</div></div></div>';
  const many = ALPHA_TESTERS.length > 8;
  const testers = ALPHA_TESTERS.length
    ? (many ? '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding:6px 2px">' + ALPHA_TESTERS.map((n) => '<div style="font-size:16px">' + esc(n) + '</div>').join('') + '</div>'
            : ALPHA_TESTERS.map((n, i) => '<div class="row" style="' + (i ? 'border-top:1px solid var(--line);' : 'border:0;') + 'padding:12px 0"><div class="grow" style="font-size:17px">' + esc(n) + '</div></div>').join(''))
    : '<div class="empty">Pronto</div>';
  return '<div class="card" style="padding-top:6px;padding-bottom:6px">' + role('Leonardo Richarte', 'Director creativo, diseño de UI y concepto') + '<div class="hr" style="margin:0"></div>' + role('Claude', 'Programación') + '</div>' +
    '<div style="display:flex;gap:8px;align-items:flex-start;padding:2px 10px 4px"><span style="flex:none;margin-top:1px;opacity:.7">' + ICON.info + '</span><div class="sub" style="font-size:13px;line-height:1.35">El uso de IA fue limitado a la programación de la aplicación.</div></div>' +
    secHead('Testers de la alpha') + '<div class="card" style="padding-top:6px;padding-bottom:6px">' + testers + '</div>' +
    '<div class="sub" style="text-align:center;padding:22px 0 6px;font-size:13px">Plata · ' + APP_VERSION + '</div>';
}

const AVATAR_DEF = ['#C9CFDD', '#98A2BA', '#5A6482', '#E1E6F2'];
function avatarGrad() { try { if (!insOn() || !scoreOn()) return AVATAR_DEF; const m = insightsModel(); return !insLocked(m) && GRAD[m.letter] ? GRAD[m.letter] : AVATAR_DEF; } catch (e) { return AVATAR_DEF; } }
function avatarHTML(sz) { return '<span style="position:relative;overflow:hidden;flex:none;width:' + sz + 'px;height:' + sz + 'px;border-radius:50%;background:' + insBg(avatarGrad()) + ';display:flex;align-items:center;justify-content:center" aria-hidden="true">' + SFI('f13in', sz, '#fff') + '</span>'; }
function profileCardHTML() {
  const st = data.settings || {}, nm = [(st.first || '').trim(), (st.last || '').trim()].filter(Boolean).join(' ');
  return '<button class="scard tap" data-act="profile" style="display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:14px 16px;margin-top:4px">' + avatarHTML(64) +
    '<span class="grow" style="min-width:0"><span style="display:block;font-size:22px;font-weight:700;letter-spacing:-.4px;color:#1C1C1E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(nm || 'Tu perfil') + '</span><span class="sub" style="display:block;font-size:14px;margin-top:2px">Nombre, género, idioma y monedas</span></span>' + ICON.chev + '</button>';
}
function profileHTML() {
  const st = data.settings || {};

    '<div class="scard">' +
    '<div class="row"><span class="grow" style="font-size:17px">Nombre</span><input class="mini" id="sFirst" style="width:55%;text-align:right" autocomplete="given-name" value="' + esc(st.first || '') + '"></div>' +
    '<div class="row"><span class="grow" style="font-size:17px">Apellido</span><input class="mini" id="sLast" style="width:55%;text-align:right" autocomplete="family-name" value="' + esc(st.last || '') + '"></div>' +

/* ---------- Pantalla de bienvenida ---------- */
const KEY_WELCOME = 'finanzas.welcomed';
const wSeen = () => { try { return localStorage.getItem(KEY_WELCOME) === '1'; } catch (e) { return false; } };
function wMark(v) { try { if (v) localStorage.setItem(KEY_WELCOME, '1'); else localStorage.removeItem(KEY_WELCOME); } catch (e) { /* sin almacenamiento */ } }
function hideWelcome() { const w = $('#welcome'); wMark(true); const m = $('#wmenu'); if (m) m.remove(); const b = $('#wmenuback'); if (b) b.remove(); if (w) { w.style.transition = 'opacity .35s'; w.style.opacity = '0'; setTimeout(() => w.remove(), 380); } ui.w = null; }
function wCustSet(w, raw) {
  const c = normCustom(raw), old = w.custom || '';
  if (c === old) return;
  const i = w.cur.indexOf(old);
  w.custom = c; regCustom(c);
  if (old && i >= 0) { if (c) w.cur[i] = c; else if (w.cur.length > 1) w.cur.splice(i, 1); }
  if (!old && c && w.cur.length < 2 && w.cur.indexOf(c) < 0) w.cur.push(c);
  if (w.accCur === old) w.accCur = w.cur[0];
  w.fx = 0;
}
function wSync() {
  const w = ui.w; if (!w) return;
  const g = (id) => { const e = $('#' + id); return e ? e.value : null; };
  if (g('wCust') != null) wCustSet(w, g('wCust'));
  if (g('wFirst') != null) w.first = g('wFirst');
  if (g('wLast') != null) w.last = g('wLast');
  if (g('wNick') != null) w.nick = g('wNick');
  if (g('wFx') != null) w.fx = parseFloat(String(g('wFx')).replace(',', '.')) || w.fx;
  if (g('wName') != null) w.accName = g('wName');
  if (g('wBal') != null) w.bal = g('wBal');
  if (g('wIncName') != null) w.incName = g('wIncName');
  if (g('wIncAmt') != null) w.incAmt = g('wIncAmt');
  if (g('wIncDate') != null) w.incDate = g('wIncDate') || w.incDate;
}
function welcomeHTML() {

  const back = '<button class="back" data-act="wback" aria-label="Regresar">' + IC_BACK + '</button>';
  if (w) { if (!w.cur || !w.cur.length) w.cur = ['USD']; if (w.cur.indexOf(w.accCur) < 0) w.accCur = w.cur[0]; if (!(w.fx > 0) && w.cur[1]) w.fx = fxDefault(w.cur[0], w.cur[1]); }
  const sym = w ? symOf(w.accCur).trim() : '$';
  if (!w) {
    el.innerHTML = '<div class="wtop"></div><div class="wmain"><div class="wbrand">Plata</div><div class="wtag">Tus finanzas, claras y sencillas.</div></div>' +
      '<div class="wnote" style="font-size:13px;font-weight:500;margin:0 0 12px">Alpha 101</div><div class="wrow"><button class="primary" data-act="wstart" style="flex:1">Empezar</button><button class="wdotbtn" data-act="wmenu" aria-label="Más opciones">' + RMI('more-fill', 24, '#1C1C1E') + '</button></div>' +
      '<button class="wghost" data-act="wload">Cargar archivo de perfil</button>';
    return;
  }
  let body = '', foot = '';
  if (w.step === 0) {
    body = '<h1>¿Cómo te llamas?</h1><div class="wsub">Opcional. Plata lo usará para saludarte; puedes cambiarlo en Ajustes.</div>' +
      '<div class="scard"><label class="srow"><span class="grow"><span class="slabel">Nombre</span><input class="sinput" id="wFirst" autocomplete="given-name" value="' + esc(w.first) + '"></span></label>' +
      '<label class="srow"><span class="grow"><span class="slabel">Apellido</span><input class="sinput" id="wLast" autocomplete="family-name" value="' + esc(w.last) + '"></span></label>' +
      '<label class="srow"><span class="grow"><span class="slabel">Apodo</span><input class="sinput" id="wNick" autocomplete="off" placeholder="Cómo quieres que te llamemos" value="' + esc(w.nick) + '"></span></label></div>' +
      '<div class="wsub" style="margin-top:14px">Género (para dirigirnos a ti correctamente)</div>' +
      segHTML('wgen', [{ k: 'm', label: 'Masculino', act: 'wset:gender:m' }, { k: 'f', label: 'Femenino', act: 'wset:gender:f' }, { k: 'n', label: 'Neutro', act: 'wset:gender:n' }], w.gender) +
      '<div class="wnote" style="font-style:italic;text-align:left;margin:10px 4px 0;font-size:13.5px">' + esc(genderExample(w.gender, w.nick || w.first)) + '</div>';
    foot = '<button class="primary" data-act="wnext">Continuar</button><button class="wghost" data-act="wnext">Omitir</button>';
  } else if (w.step === 1) {
    const iOn = w.ins !== false, sOn = iOn && w.score !== false;
    body = '<h1>Insights</h1><div class="wsub">Cada mes comparamos tus movimientos con los del anterior y te damos una evaluación de la F a la S, junto con consejos sobre tu presupuesto, tus metas de ahorro y tus deudas. Puedes cambiarlo después en Ajustes.</div>' +
      '<div class="scard"><div class="row"><span class="grow" style="font-size:17px">Activar Insights</span>' + swHTML(iOn, 'wtog:ins') + '</div>' +
      '<div class="row"><span class="grow" style="font-size:17px">Mostrar puntuación (F–S)</span>' + swHTML(sOn, 'wtog:score', !iOn) + '</div></div>';
    foot = '<div class="wnote">Esta información no es recopilada por Plata ni Estudio 22. Toda la información se maneja en tu archivo de perfil.</div><button class="primary" data-act="wnext">Continuar</button>';
  } else if (w.step === 2) {
    const sel = w.cur, one = sel.length < 2;

      '<div class="ccyg">' + CUR_BUILTIN.concat([w.custom || '*']).map((c) => { if (c === '*') return '<button class="ccy" data-act="wcust"><b>+</b><span>Personalizada</span></button>'; const i = sel.indexOf(c), dis = i < 0 && !one; return '<button class="ccy' + (i >= 0 ? ' on' : '') + (dis ? ' dis' : '') + '" data-act="wcur:' + c + '"' + (dis ? ' disabled' : '') + '><b>' + c + '</b><span>' + symOf(c).trim() + '</span>' + (i >= 0 && !one ? '<i>' + (i + 1) + '</i>' : '') + '</button>'; }).join('') + '</div>' +
      (w.customOpen || w.custom ? '<div class="scard"><label class="srow"><span class="grow"><span class="slabel">Moneda personalizada (hasta 3 caracteres)</span><input class="sinput" id="wCust" maxlength="3" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase" value="' + esc(w.custom || '') + '"></span></label></div>' : '') +
      '<div class="sub" style="padding:2px 4px 12px">' + (one ? 'Principal: ' + CURRENCIES[sel[0]].name + '.' : 'Principal: ' + sel[0] + ' · Segunda: ' + sel[1]) + '</div>' +
      (one ? '' : '<div class="scard"><label class="srow"><span class="grow"><span class="slabel">1 ' + sel[0] + ' en ' + sel[1] + '</span><input class="sinput" id="wFx" inputmode="decimal" value="' + w.fx + '"></span></label></div><button class="wghost" data-act="wswap" style="height:46px;font-size:16px;margin-top:0">Usar ' + sel[1] + ' como principal</button>');
    foot = (sel.indexOf('PEN') >= 0 ? '<div class="wnote" style="font-style:italic;color:#AEAEB2;font-size:13px">¡Que viva el Perú ca****!</div>' : '') + '<button class="primary" data-act="wnext">Continuar</button>';
  } else if (w.step === 3) {

      segHTML('wtype', [{ k: 'checking', label: 'Corriente', act: 'wset:accType:checking' }, { k: 'savings', label: 'Ahorros', act: 'wset:accType:savings' }, { k: 'cash', label: 'Efectivo', act: 'wset:accType:cash' }], w.accType) +
      (w.cur.length > 1 ? segHTML('wcur', w.cur.map((c) => ({ k: c, label: c + ' (' + symOf(c).trim() + ')', act: 'wset:accCur:' + c })), w.accCur) : '') +
      '<div class="scard"><label class="srow"><span class="grow"><span class="slabel">Nombre</span><input class="sinput" id="wName" autocomplete="off" value="' + esc(w.accName) + '"></span></label>' +

    body = '<h1>¿Cuánto ganas?</h1><div class="wsub">Opcional. Así Plata prevé tus próximos ingresos.</div>' +

      '<div class="scard"><label class="srow"><span class="grow"><span class="slabel">Nombre</span><input class="sinput" id="wIncName" autocomplete="off" value="' + esc(w.incName) + '"></span></label>' +
      '<label class="srow"><span class="grow"><span class="slabel">Monto (' + sym + ')</span><input class="sinput" id="wIncAmt" inputmode="decimal" placeholder="0.00" autocomplete="off" value="' + esc(w.incAmt) + '"></span></label>' +

function showWelcome() {
  if ($('#welcome')) return;
  const el = document.createElement('div'); el.id = 'welcome'; el.className = 'welcome'; deviceEl.appendChild(el); ui.w = null; welcomeHTML();
}
function wMenu() {
  if ($('#wmenu')) { wCloseMenu(); return; }
  const w = $('#welcome'), btn = w.querySelector('.wdotbtn'), d = w.getBoundingClientRect(), r = btn.getBoundingClientRect(), k = d.width / w.offsetWidth || 1;
  const bk = document.createElement('div'); bk.id = 'wmenuback'; bk.setAttribute('data-act', 'wmenuclose'); bk.style.cssText = 'position:absolute;inset:0;z-index:160';
  const m = document.createElement('div'); m.id = 'wmenu'; m.className = 'popmenu'; m.style.zIndex = '170'; m.style.transformOrigin = '100% 100%';
  const ic = (c, n) => RMI(n, 22, c);
  m.innerHTML = '<button class="pmi" data-act="wquick" style="gap:12px;padding-left:18px">' + ic('#0A84FF', 'flashlight-line') + '<span style="display:flex;flex-direction:column;align-items:flex-start;text-align:left"><span>Inicio rápido</span><span style="font-size:12.5px;font-weight:400;color:#6C6C70;line-height:1.25;margin-top:1px;white-space:normal">Adelanta el recorrido inicial.</span></span></button><div class="pmsep"></div>' +
    '<button class="pmi" data-act="wdemo" style="gap:12px;padding-left:18px">' + ic('#B98AE6', 'bar-chart-line') + '<span style="display:flex;flex-direction:column;align-items:flex-start;text-align:left"><span>Datos de demostración</span><span style="font-size:12.5px;font-weight:400;color:#6C6C70;line-height:1.25;margin-top:1px;white-space:normal">Revisa un ejemplo de alguien usando Plata.</span></span></button>';
  w.appendChild(bk); w.appendChild(m);
  m.style.right = ((d.right - r.right) / k) + 'px'; m.style.bottom = ((d.bottom - r.top) / k + 8) + 'px';
  requestAnimationFrame(() => m.classList.add('in'));
}
function wCloseMenu() { const m = $('#wmenu'); if (m) { m.classList.remove('in'); setTimeout(() => m.remove(), 180); } const b = $('#wmenuback'); if (b) b.remove(); }
function wFinish(skipInc) {
  wSync(); const w = ui.w; if (!w) return;
  const fresh = clone(EMPTY), acc = fresh.accounts[0];
  fresh.settings = Object.assign({}, fresh.settings || {}, { first: (w.first || '').trim(), last: (w.last || '').trim(), nick: (w.nick || '').trim(), gender: w.gender || 'n', insights: w.ins !== false, score: w.ins !== false && w.score !== false, currency: w.cur[0], currency2: w.cur[1] || '', customCur: w.custom || '', fx: w.cur[1] ? (w.fx > 0 ? w.fx : fxDefault(w.cur[0], w.cur[1])) : (fresh.settings && fresh.settings.fx) || 3.5 });
  acc.name = (w.accName || '').trim() || 'Cuenta principal'; acc.type = w.accType; acc.cur = w.cur.indexOf(w.accCur) >= 0 ? w.accCur : w.cur[0]; acc.balance = round2(parseFloat(String(w.bal).replace(',', '.')) || 0);
  const amt = parseFloat(String(w.incAmt).replace(',', '.'));

/* ---------- Arranque ---------- */
(function () {
  const sp = document.getElementById('splash'); if (!sp) return;
  if (/[?&]nosplash/.test(location.search)) { sp.remove(); return; }
  if (!hasData() && !wSeen()) { sp.remove(); return; } // primer arranque: la bienvenida ocupa su lugar
  const hide = () => { sp.classList.add('off'); setTimeout(() => sp.remove(), 700); };
  sp.addEventListener('click', hide); setTimeout(hide, 1500);
})();
if (/[?&]preview/.test(location.search)) document.documentElement.classList.add('preview');
if (/[?&]frame/.test(location.search)) document.documentElement.classList.add('frame');
function fitFrame() {
  const s = document.documentElement.classList.contains('frame') && window.innerWidth >= 600 ? Math.min(1, (window.innerHeight - 48) / 874) : 1;
  document.documentElement.style.setProperty('--s', String(s));
}
window.addEventListener('resize', fitFrame); fitFrame();
applyLang(); renderAll(); setTab('resumen'); movePill(true);
if (!hasData() && !wSeen() && (!/[?&]nosplash/.test(location.search) || /[?&]welcome/.test(location.search))) { showWelcome(); } else setTimeout(checkPending, 800);

if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
})();
