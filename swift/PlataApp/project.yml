# Proyecto de Xcode de la app nativa de Plata, descrito para XcodeGen (el .xcodeproj no se versiona).
#   brew install xcodegen  →  cd swift/PlataApp && xcodegen  →  abrir Plata.xcodeproj
name: Plata
options:
  bundleIdPrefix: net.plataapp
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  PlataCore:
    path: ../PlataCore
targets:
  Plata:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Plata
    dependencies:
      - package: PlataCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.plataapp.plata   # CÁMBIALO si tu App ID en Apple Developer es otro
        DEVELOPMENT_TEAM: "8YMVGT4T6Q"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"                     # iPhone primero; iPad después
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Plata
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: SplashGreen
        INFOPLIST_KEY_UILaunchScreen_ImageName: SplashLogo
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
