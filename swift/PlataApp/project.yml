# Proyecto de Xcode de la app nativa de Plata, descrito para XcodeGen (el .xcodeproj no se versiona).
#   brew install xcodegen  →  cd swift/PlataApp && xcodegen  →  abrir Plata.xcodeproj
name: Plata
options:
  bundleIdPrefix: net.plataapp
  developmentLanguage: es
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "3"
packages:
  PlataCore:
    path: ../PlataCore
targets:
  Plata:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Plata
      - path: Shared
      - path: SharedPhone
    dependencies:
      - package: PlataCore
      - target: PlataWatch
      - target: PlataWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.plataapp.plata   # CÁMBIALO si tu App ID en Apple Developer es otro
        DEVELOPMENT_TEAM: "8YMVGT4T6Q"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Plata/Plata.entitlements
        TARGETED_DEVICE_FAMILY: "1"                     # iPhone primero; iPad después
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Plata
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: SplashGreen
        INFOPLIST_KEY_UILaunchScreen_ImageName: SplashLogo
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait

  PlataWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    dependencies:
      - target: PlataWatchWidgets
    sources:
      - path: PlataWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.plataapp.plata.watchkitapp   # CÁMBIALO si tu App ID del reloj es otro
        DEVELOPMENT_TEAM: "8YMVGT4T6Q"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Plata
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: net.plataapp.plata
        INFOPLIST_KEY_WKApplication: YES
        CODE_SIGN_ENTITLEMENTS: PlataWatch/PlataWatch.entitlements

  PlataWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: PlataWatchWidgets
      - path: Shared
    info:
      path: PlataWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Plata
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.plataapp.plata.watchkitapp.widgets
        DEVELOPMENT_TEAM: "8YMVGT4T6Q"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_ENTITLEMENTS: PlataWatchWidgets/PlataWatchWidgets.entitlements
        SKIP_INSTALL: YES

  PlataWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PlataWidgets
      - path: Shared
      - path: SharedPhone
    info:
      path: PlataWidgets/Info.plist
      properties:
        CFBundleDisplayName: Plata
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.plataapp.plata.widgets
        DEVELOPMENT_TEAM: "8YMVGT4T6Q"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: PlataWidgets/PlataWidgets.entitlements
        SKIP_INSTALL: YES
