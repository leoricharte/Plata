# Proyecto de Xcode de la app nativa de Plata, descrito para XcodeGen (el .xcodeproj no se versiona).
#   brew install xcodegen  →  cd swift/PlataApp && xcodegen  →  abrir Plata.xcodeproj
name: Plata
options:
  bundleIdPrefix: net.plataapp
  developmentLanguage: es
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "40"
packages:
  PlataCore:
    path: ../PlataCore
targets:
  Plata:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Plata
      - path: Shared
      - path: SharedPhone
      - path: SharedConstancia
    dependencies:
      - package: PlataCore
      - target: PlataWatch
      - target: PlataWidgets
      - target: PlataShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.plataapp.plata   # CÁMBIALO si tu App ID en Apple Developer es otro
        DEVELOPMENT_TEAM: "8YMVGT4T6Q"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Plata/Plata.entitlements
        TARGETED_DEVICE_FAMILY: "1"                     # iPhone primero; iPad después
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Plata
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSFaceIDUsageDescription: Plata usa Face ID para abrir la app de forma segura.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: SplashGreen
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait

  PlataWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    dependencies:
      - target: PlataWatchWidgets
    sources:
      - path: PlataWatch
      - path: Shared
      - path: SharedWatch
      - path: Plata/Tr.swift
      - path: Plata/Resources/tr_en.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.plataapp.plata.watchkitapp   # CÁMBIALO si tu App ID del reloj es otro
        DEVELOPMENT_TEAM: "8YMVGT4T6Q"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Plata
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: net.plataapp.plata
        INFOPLIST_KEY_WKApplication: YES
        CODE_SIGN_ENTITLEMENTS: PlataWatch/PlataWatch.entitlements

  PlataWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: PlataWatchWidgets
      - path: Shared
      - path: SharedWatch
      - path: Plata/Tr.swift
      - path: Plata/Resources/tr_en.json
    info:
      path: PlataWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Plata
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.plataapp.plata.watchkitapp.widgets
        DEVELOPMENT_TEAM: "8YMVGT4T6Q"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_ENTITLEMENTS: PlataWatchWidgets/PlataWatchWidgets.entitlements
        SKIP_INSTALL: YES

  PlataShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PlataShare
      - path: SharedConstancia
      - path: Plata/Tr.swift
      - path: Plata/Resources/tr_en.json
    dependencies:
      - package: PlataCore
    info:
      path: PlataShare/Info.plist
      properties:
        CFBundleDisplayName: Plata
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf").@count == 1).@count == 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.plataapp.plata.share
        DEVELOPMENT_TEAM: "8YMVGT4T6Q"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: PlataShare/PlataShare.entitlements
        SKIP_INSTALL: YES

  PlataWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PlataWidgets
      - path: Shared
      - path: SharedPhone
      - path: Plata/Tr.swift
      - path: Plata/Resources/tr_en.json
    info:
      path: PlataWidgets/Info.plist
      properties:
        CFBundleDisplayName: Plata
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.plataapp.plata.widgets
        DEVELOPMENT_TEAM: "8YMVGT4T6Q"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: PlataWidgets/PlataWidgets.entitlements
        SKIP_INSTALL: YES
